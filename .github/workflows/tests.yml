name: Tests

# Web tests run on every push (the same page is the web app and the Android app's screens).
# The Android workflow calls this first and only builds a release if it passes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install pytest==8.3.3 playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Web tests
        run: python -m pytest tests -q
