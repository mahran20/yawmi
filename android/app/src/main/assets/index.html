<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>يومي</title>
<style>
@font-face{font-family:"Plex Ar";src:url(fonts/plex-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Plex Ar";src:url(fonts/plex-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Plex Ar";src:url(fonts/plex-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Readex";src:url(fonts/readex-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Readex";src:url(fonts/readex-700.woff2) format("woff2");font-weight:700;font-display:swap}
/* Layout: one RTL column. Views: welcome (first run), today, edit (your space), settings. A bottom sheet picks icons/colors. */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --ink:#17201b; --muted:#5d6a63; --line:#dbe2dd;
  --accent-ink:#ffffff; --warn:#8a5410; --warn-soft:#fbefd9; --danger:#b4432f; --danger-soft:#f8e3de;
  --h-green:#1f6b5c; --h-teal:#0e6f7a; --h-blue:#2457a6; --h-purple:#6a43a8; --h-rose:#a83a5c; --h-amber:#93590c; --h-orange:#b8521c; --h-gray:#56635c;
  --accent:var(--h-green);
  --accent-soft:color-mix(in srgb,var(--accent) 13%,var(--surface));
  --display:"Readex","Segoe UI",Tahoma,sans-serif; --body:"Plex Ar","Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#101513; --surface:#19201d; --ink:#e6ece8; --muted:#95a29b; --line:#2a3430;
  --accent-ink:#0d1512; --warn:#f0bf6e; --warn-soft:#3a2c14; --danger:#ee8a76; --danger-soft:#3b211c;
  --h-green:#6cc2ab; --h-teal:#62c6d1; --h-blue:#86aef0; --h-purple:#b99be9; --h-rose:#ef8fae; --h-amber:#efb560; --h-orange:#f2995f; --h-gray:#a6b2ab;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
#app{max-width:600px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:1.45rem;font-weight:700}
h2{font-size:1.02rem;font-weight:600}
h3{font-size:.92rem;font-weight:600;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top .sub{color:var(--muted);font-size:.88rem;margin:0}
.top .acts{display:flex;gap:8px}
.iconbtn{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);flex:none;padding:0}
.iconbtn svg{width:22px;height:22px}
.iconbtn.sm{width:38px;height:38px;border-radius:10px;font-size:1.05rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gtitle{display:flex;align-items:center;gap:10px;min-width:0}
.gicon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:1.1rem;flex:none;background:color-mix(in srgb,var(--c,var(--accent)) 15%,var(--surface));color:var(--c,var(--accent))}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;white-space:nowrap}
.count.full{color:var(--c,var(--accent));font-weight:600}
.hint{color:var(--muted);font-size:.86rem;margin:0}
.prayerbar{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.np{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.np strong{font-family:var(--display);font-size:1.25rem;font-weight:700}
.np .left{font-size:.92rem;opacity:.9}
.np-label,.alarmline{font-size:.84rem;opacity:.9}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px}
.datebar button{background:none;border:0;font-size:1.3rem;width:42px;height:42px;border-radius:9px}
.datebar button:disabled{opacity:.3;cursor:default}
.datelabel{text-align:center}
.datelabel strong{display:block;font-weight:600}
.datelabel span{color:var(--muted);font-size:.85rem}
.tiles{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
.tiles.cols5{grid-template-columns:repeat(5,minmax(0,1fr))}
.tile{position:relative;font-weight:500;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 4px;min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;min-width:0}
.tile .lb{overflow-wrap:anywhere}
.tile .mark{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:transparent}
.tile .emo{font-size:1.25rem;line-height:1.2}
.tile .badge{position:absolute;top:6px;left:6px;width:18px;height:18px;border-radius:50%;display:none;place-items:center;font-size:.65rem;font-weight:700;background:var(--c,var(--accent));color:var(--surface)}
.tile small{color:var(--muted);font-size:.74rem;font-weight:400;font-variant-numeric:tabular-nums}
.tile.on{background:color-mix(in srgb,var(--c,var(--accent)) 14%,var(--surface));border-color:var(--c,var(--accent));color:var(--c,var(--accent))}
.tile.on .mark{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--surface)}
.tile.on .badge{display:grid}
.tile.on small{color:var(--c,var(--accent))}
.btn{border:0;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:10px 16px;min-height:42px}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.9rem}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.wide{width:100%}
.btn.link{background:none;color:var(--muted);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.inp,select,textarea{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;font-size:.85rem;direction:ltr;text-align:left}
.add{display:flex;gap:8px;align-items:center}
.add .inp{flex:1}
.due{display:flex;align-items:center;gap:8px}
.due label{color:var(--muted);font-size:.9rem;white-space:nowrap}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.task{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:11px;background:var(--bg)}
.task .chk{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:transparent;font-weight:700;font-size:.85rem;display:grid;place-items:center}
.task.done .chk{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.task .txt{flex:1;min-width:0;overflow-wrap:anywhere;display:flex;flex-direction:column}
.task .txt small{color:var(--muted);font-size:.8rem}
.task .txt small.late{color:var(--danger);font-weight:600}
.task.done .txt span{color:var(--muted);text-decoration:line-through}
.task .del{flex:none;background:none;border:0;color:var(--muted);font-size:.85rem;padding:6px;border-radius:6px}
.empty{color:var(--muted);font-size:.9rem;margin:0}
details summary{cursor:pointer;color:var(--muted);font-size:.9rem;padding:4px 0}
details ul{margin-top:6px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:.9rem}
.banner.up{background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:.88rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.packs{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.pack{display:flex;align-items:center;gap:10px;text-align:start;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px}
.pack .gicon{width:32px;height:32px}
.pack span{display:flex;flex-direction:column;min-width:0}
.pack small{color:var(--muted);font-size:.78rem}
.pack.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:42px}
.row > span{min-width:0}
.ok{color:var(--accent);font-weight:600;font-size:.9rem;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.88rem;color:var(--muted)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px;font-weight:500}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--surface);background:var(--c);box-shadow:0 0 0 1px var(--line);padding:0;display:grid;place-items:center;color:var(--surface);font-weight:700}
.sw.on{box-shadow:0 0 0 2px var(--c)}
.sw.none{background:var(--bg);color:var(--muted);font-size:.7rem}
.switch{position:relative;width:52px;height:30px;border-radius:999px;border:0;background:var(--line);flex:none;padding:0}
.switch span{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch.on{background:var(--accent)}
.switch.on span{transform:translateX(-22px)}
.ge{display:flex;flex-direction:column;gap:8px}
.ge-head{display:flex;align-items:center;gap:8px}
.ge-head .inp{font-weight:600}
.pickbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font-size:1.05rem;flex:none;padding:0;background:color-mix(in srgb,var(--c,var(--accent)) 15%,var(--surface));color:var(--c,var(--accent))}
.ie{display:grid;grid-template-columns:38px minmax(0,1fr) 108px 38px;gap:6px;align-items:center}
.ie .time{padding:8px 6px;font-size:.88rem}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:8}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;max-width:600px;margin:0 auto}
.emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.emojis button{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:1.3rem;padding:0}
.emojis button.on{border-color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.92rem;max-width:calc(100% - 32px);text-align:center;z-index:10;box-shadow:0 6px 20px rgba(0,0,0,.18)}
@media (prefers-reduced-motion:no-preference){.tile,.task .chk,.chip,.pack,.seg button{transition:background-color .15s,border-color .15s}}
</style>
</head>
<body>
<main id="app"></main>
<div id="sheet-root"></div>
<div class="toast" id="toast" hidden></div>
<script>
(function(){
"use strict";
const A = window.Android || null;
const app = document.getElementById("app");
const sheetRoot = document.getElementById("sheet-root");
const $ = s => document.querySelector(s);
const AR = "٠١٢٣٤٥٦٧٨٩";
const ar = s => String(s).replace(/\d/g, d => AR[d]);
const pad = n => String(n).padStart(2,"0");
const keyOf = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const clone = o => JSON.parse(JSON.stringify(o));
const CUT = 3;
const UA = navigator.userAgent || "";
const IS_ANDROID = /android/i.test(UA);
const IS_IOS = /iphone|ipad|ipod/i.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const STANDALONE = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const PRAYERS = ["fajr","dhuhr","asr","maghrib","isha"];
const PN = {fajr:"الفجر",dhuhr:"الظهر",asr:"العصر",maghrib:"المغرب",isha:"العشاء"};
const APK = "https://github.com/mahran20/yawmi/releases/latest/download/yawmi.apk";
const CITIES = [["القاهرة",30.0444,31.2357],["الجيزة",30.0131,31.2089],["الإسكندرية",31.2001,29.9187],["المنصورة",31.0409,31.3785],["طنطا",30.7865,31.0004],["أسيوط",27.1810,31.1837],["الأقصر",25.6872,32.6396],["أسوان",24.0889,32.8998]];
const COLORS = ["green","teal","blue","purple","rose","amber","orange","gray"];
const COLOR_NAMES = {green:"أخضر",teal:"فيروزي",blue:"أزرق",purple:"بنفسجي",rose:"وردي",amber:"عسلي",orange:"برتقالي",gray:"رمادي"};
const ACCENTS = ["green","teal","blue","purple","rose","amber"];
const BG = {light:"#f2f5f3", dark:"#101513"};
const EMOJIS = ["🕌","📿","📖","🤲","☀️","🌙","🌅","⭐","🪥","🦷","💧","🥛","🥗","🍎","💊","🥤","🏋️","🏃","🚶","🧘","⚽","🚴","😴","🛏️","📚","✍️","🧠","🎧","💻","💼","📞","💰","🛒","🧹","🧺","👨‍👩‍👧","❤️","🎯","✅","🔥","🌱","☕","🚭","📵","🧴","🪴","🗓️","🎨"];
const ICON = {
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
};

/* ---------- templates ---------- */
const PACKS = {
  prayers:{title:"الصلوات", desc:"الخمس صلوات بمواقيتها", icon:"🕌", color:"green", kind:"prayers", items:PRAYERS.map(p => ({id:p, label:PN[p]}))},
  quran:{title:"القرآن والأذكار", desc:"الورد، أذكار الصباح والمساء", icon:"📖", color:"teal", items:[{label:"ورد القرآن", icon:"📖"},{label:"أذكار الصباح", icon:"☀️"},{label:"أذكار المساء", icon:"🌙"}]},
  health:{title:"الصحة", desc:"رياضة، مية، نوم بدري", icon:"💪", color:"orange", items:[{label:"رياضة", icon:"🏋️"},{label:"مية كفاية", icon:"💧"},{label:"نوم بدري", icon:"😴"}]},
  care:{title:"العناية الشخصية", desc:"غسيل السنان الصبح وبالليل", icon:"🪥", color:"blue", items:[{label:"السنان الصبح", icon:"🪥"},{label:"السنان بالليل", icon:"🪥"}]},
  growth:{title:"تطوير نفسي", desc:"قراية وتعلّم", icon:"📚", color:"purple", items:[{label:"قراية ١٠ صفحات", icon:"📚"},{label:"تعلّم حاجة جديدة", icon:"🧠"}]}
};
function groupFromPack(key){
  const p = PACKS[key];
  return {id: key === "prayers" ? "prayers" : uid("g"), pack:key, kind:p.kind || null, title:p.title, icon:p.icon, color:p.color,
    items:p.items.map(i => ({id:i.id || uid("i"), label:i.label, icon:i.icon || null}))};
}

/* Legacy layout (the first version of the app) used only to migrate old data. */
const LEGACY = [
  {id:"prayers",title:"الصلوات",kind:"prayers",icon:"🕌",color:"green",items:PRAYERS.map(p=>({id:p,label:PN[p]}))},
  {id:"dhikr",title:"القرآن والأذكار",icon:"📖",color:"teal",items:[{id:"quran",label:"ورد القرآن",sub:"الورد اليومي"},{id:"adhkar_am",label:"أذكار الصباح"},{id:"adhkar_pm",label:"أذكار المساء"}]},
  {id:"teeth",title:"غسيل السنان",icon:"🪥",color:"blue",items:[{id:"teeth_am",label:"الصبح",sub:"أول ما أصحى"},{id:"teeth_pm",label:"بالليل",sub:"قبل ما أنام"}]},
  {id:"supps",title:"التمرين والمكملات",icon:"🏋️",color:"orange",items:[{id:"train",label:"التمرين"},{id:"creatine",label:"كرياتين"},{id:"protein",label:"بروتين"},{id:"carbs",label:"كارب"},{id:"pills",label:"البرشام",sub:"فيتامينات، زنك، أوميجا"}]}
];
const LEGACY_STYLE = {prayers:["🕌","green"], dhikr:["📖","teal"], teeth:["🪥","blue"], supps:["🏋️","orange"]};

function defaults(){ return {
  v:3, onboarded:false,
  settings:{ name:"", theme:{mode:"system", accent:"green"}, loc:{name:"القاهرة",lat:30.0444,lng:31.2357},
    prayerNotify:{fajr:true,dhuhr:true,asr:true,maghrib:true,isha:true},
    alarm:{enabled:false,offset:15,code:null},
    nightly:{enabled:true,time:"22:50"} },
  groups:[], days:{}, tasks:{} }; }

function normalize(o){
  const d = defaults();
  if(!o || typeof o !== "object") return d;
  const s = o.settings || {};
  o.settings = Object.assign(d.settings, s);
  const fresh = defaults().settings;
  for(const k of ["theme","loc","prayerNotify","alarm","nightly"]) o.settings[k] = Object.assign(fresh[k], s[k] || {});
  if(!COLORS.includes(o.settings.theme.accent)) o.settings.theme.accent = "green";
  if(!["system","light","dark"].includes(o.settings.theme.mode)) o.settings.theme.mode = "system";
  if(!Array.isArray(o.groups)) o.groups = [];
  o.groups.forEach((g, i) => {
    if(!Array.isArray(g.items)) g.items = [];
    if(g.id === "prayers" && !g.kind) g.kind = "prayers";
    delete g.fixed;
    const st = LEGACY_STYLE[g.id];
    if(!g.icon && st) g.icon = st[0];
    if(!g.color) g.color = st ? st[1] : COLORS[i % COLORS.length];
  });
  if((o.v || 0) < 3 && o.groups.length) o.onboarded = true;

/* ---------- time ---------- */
function fmt12(hm){ if(!hm) return ""; let [h,m] = hm.split(":").map(Number); const ap = h < 12 ? "ص" : "م"; h = h % 12 || 12; return ar(h+":"+pad(m))+" "+ap }
function hmOf(ms){ const d = new Date(ms); return pad(d.getHours())+":"+pad(d.getMinutes()) }
function dayWord(ms){
  const a = new Date(ms); a.setHours(0,0,0,0); const b = new Date(); b.setHours(0,0,0,0);
  const diff = Math.round((a - b) / 864e5);
  if(diff === 0) return "النهارده"; if(diff === 1) return "بكرة"; if(diff === -1) return "امبارح";
  return a.toLocaleDateString("ar-EG",{weekday:"short",day:"numeric",month:"short"});
}
function fmtWhen(ms){ return dayWord(ms)+" "+fmt12(hmOf(ms)) }
function fmtLeft(ms){ const t = Math.max(0, Math.ceil(ms/60000)); const h = Math.floor(t/60), m = t % 60; return h ? "بعد "+ar(h+":"+pad(m)) : "بعد "+ar(m)+" دقيقة" }

function calcTimes(date, lat, lng){
  const d2r = x => x*Math.PI/180, r2d = x => x*180/Math.PI, fix = (a,b) => ((a % b) + b) % b;
  const y0 = date.getFullYear(), m0 = date.getMonth()+1, dd = date.getDate();
  let y = y0, m = m0; if(m <= 2){ y -= 1; m += 12 }
  const a = Math.floor(y/100), b = 2 - a + Math.floor(a/4);
  const jd = Math.floor(365.25*(y+4716)) + Math.floor(30.6001*(m+1)) + dd + b - 1524.5 - lng/(15*24);
  const tz = -new Date(y0, m0-1, dd, 12).getTimezoneOffset()/60;
  function sun(j){
    const D = j - 2451545, g = fix(357.529+0.98560028*D,360), q = fix(280.459+0.98564736*D,360);
    const L = fix(q + 1.915*Math.sin(d2r(g)) + 0.020*Math.sin(d2r(2*g)), 360), e = 23.439 - 0.00000036*D;
    const RA = fix(r2d(Math.atan2(Math.cos(d2r(e))*Math.sin(d2r(L)), Math.cos(d2r(L))))/15, 24);
    return [r2d(Math.asin(Math.sin(d2r(e))*Math.sin(d2r(L)))), fix(q/15 - RA + 12, 24) - 12];
  }
  const noon = t => 12 - sun(jd + t/24)[1];
  const angleT = (ang, t, ccw) => { const decl = sun(jd + t/24)[0], n = noon(t);
    const x = (-Math.sin(d2r(ang)) - Math.sin(d2r(decl))*Math.sin(d2r(lat))) / (Math.cos(d2r(decl))*Math.cos(d2r(lat)));
    const h = r2d(Math.acos(Math.max(-1, Math.min(1, x))))/15; return ccw ? n - h : n + h };
  const asrT = t => { const decl = sun(jd + t/24)[0]; return angleT(-r2d(Math.atan(1/(1+Math.tan(d2r(Math.abs(lat-decl)))))), t, false) };
  let f=5, sr=6, dh=12, as=13, mg=18, is=18;
  for(let i=0;i<2;i++){ f=angleT(19.5,f,true); sr=angleT(0.833,sr,true); dh=noon(dh); as=asrT(as); mg=angleT(0.833,mg,false); is=angleT(17.5,is,false) }
  const conv = (v, down) => { const h = v + tz - lng/15; let mm = down ? Math.floor(h*60) : Math.round(h*60); mm = ((mm % 1440) + 1440) % 1440; return pad(Math.floor(mm/60))+":"+pad(mm % 60) };
  return {fajr:conv(f,true), sunrise:conv(sr), dhuhr:conv(dh), asr:conv(as), maghrib:conv(mg), isha:conv(is)};
}
function ptimes(d){
  const k = keyOf(d);
  if(ptCache[k]) return ptCache[k];
  let r = null;
  if(A){ try{ r = JSON.parse(A.prayerTimes(k)) }catch(e){} }
  if(!r || !r.fajr) r = calcTimes(d, S.settings.loc.lat, S.settings.loc.lng);
  return ptCache[k] = r;
}
function trackedPrayers(){ const s = new Set(); S.groups.filter(g => g.kind === "prayers").forEach(g => g.items.forEach(i => { if(PN[i.id]) s.add(i.id) })); return s }
function nextPrayer(){
  const tracked = trackedPrayers(); if(!tracked.size) return null;
  const now = new Date();
  for(let off = 0; off < 2; off++){
    const d = new Date(); d.setDate(d.getDate()+off); d.setHours(12,0,0,0);
    const t = ptimes(d);
    for(const p of PRAYERS){ if(!tracked.has(p)) continue; const [h,m] = t[p].split(":").map(Number); const at = new Date(d); at.setHours(h,m,0,0); if(at > now) return {p, at, hm:t[p]} }
  }
  return null;
}

  const s = S.settings, st = status, t = s.theme;
  const offsets = [0,5,10,15,20,30,45,60].map(m => `<option value="${m}"${+s.alarm.offset === m ? " selected" : ""}>${m ? ar(m)+" دقيقة" : "مع الأذان"}</option>`).join("");
  const modes = [["system","تلقائي"],["light","فاتح"],["dark","داكن"]].map(([v,l]) => `<button class="${t.mode === v ? "on" : ""}" data-act="theme-mode" data-v="${v}" aria-pressed="${t.mode === v}">${l}</button>`).join("");
  const accents = ACCENTS.map(c => `<button class="sw${t.accent === c ? " on" : ""}" style="${cvar(c)}" data-act="theme-accent" data-v="${c}" aria-label="${COLOR_NAMES[c]}">${t.accent === c ? "✓" : ""}</button>`).join("");
  const prayersOn = hasPrayers();
  return `<header class="top"><button class="iconbtn" data-act="back" aria-label="رجوع">${ICON.back}</button><h1>الإعدادات</h1><span style="width:42px"></span></header>
  <section class="card"><h2>اسمك</h2><input class="inp" data-input="name" value="${esc(s.name)}" placeholder="اكتب اسمك" maxlength="30" autocomplete="off" aria-label="اسمك"></section>

  <section class="card"><h2>المظهر</h2><div class="seg" role="group" aria-label="الوضع">${modes}</div><h3>اللون الأساسي</h3><div class="swatches">${accents}</div></section>

  <section class="card"><h2>بنودك</h2><p class="hint">ضيف وامسح ورتّب أقسامك وبنودك، واختار لكل واحد أيقونة ولون.</p><button class="btn ghost wide" data-act="edit">عدّل مساحتك</button></section>

  <section class="card" id="sec-prayer"><h2>مواقيت الصلاة</h2>
    ${prayersOn ? `<p class="hint">محسوبة على: <strong>${esc(s.loc.name)}</strong> (الهيئة المصرية العامة للمساحة)</p>
    <div class="chips">${CITIES.map(c => `<button class="chip${s.loc.name === c[0] ? " on" : ""}" data-act="city" data-name="${c[0]}" data-lat="${c[1]}" data-lng="${c[2]}">${c[0]}</button>`).join("")}<button class="chip${s.loc.name === "موقعي" ? " on" : ""}" data-act="loc-me">موقعي الحالي</button></div>
    ${A ? `<h3>إشعار عند الأذان</h3><div class="chips">${PRAYERS.filter(p => trackedPrayers().has(p)).map(p => `<button class="chip${s.prayerNotify[p] ? " on" : ""}" data-act="pn" data-p="${p}" aria-pressed="${!!s.prayerNotify[p]}">${PN[p]}</button>`).join("")}</div><p class="hint">الإشعار فيه زرار «صليت ✓» يعلّم عليها من غير ما تفتح التطبيق.</p>` : ""}`
    : `<p class="hint">مش ظاهرة لأن مفيش قسم صلوات في مساحتك.</p><button class="btn ghost wide" data-act="add-pack" data-k="prayers">ضيف قسم الصلوات</button>`}</section>

  ${A ? `<section class="card" id="sec-alarm"><div class="head"><h2>منبه الفجر</h2>${sw("alarm-enabled", s.alarm.enabled, "منبه الفجر")}</div>
    <p class="hint">بيرن بأعلى صوت، ومفيهوش snooze، ومش بيسكت غير لما تقوم تمسح كود QR أو باركود متعلّق بعيد عن سريرك.</p>
    <div class="field"><label for="alarm-offset">يرن قبل أذان الفجر بـ</label><select id="alarm-offset" data-input="alarm-offset">${offsets}</select></div>
    <div class="row"><span>${s.alarm.code ? "الكود متسجل" : "مفيش كود متسجل لسه"}</span><button class="btn sm${s.alarm.code ? " ghost" : ""}" data-act="scan">${s.alarm.code ? "غيّر الكود" : "سجّل الكود"}</button></div>
    ${s.alarm.enabled && st.nextAlarm ? `<p class="hint">المنبه الجاي: ${fmtWhen(st.nextAlarm)}</p>` : ""}
    <button class="btn ghost wide" data-act="test-alarm">جرّب المنبه بعد ٢٠ ثانية</button>
    <p class="hint">دوس، واقفل الشاشة، واستنى. لو الكاميرا مش شغالة وقتها تقدر تسكته بحل ٣ مسائل حساب.</p></section>

  <section class="card"><div class="head"><h2>تذكير آخر اليوم</h2>${sw("nightly-enabled", s.nightly.enabled, "تذكير آخر اليوم")}</div>
    <div class="field"><label for="nightly-time">الساعة</label><input id="nightly-time" class="inp" type="time" data-input="nightly-time" value="${esc(s.nightly.time)}"></div>
    <p class="hint">بيقولك فاضلك كام بند وكام تاسك.</p></section>

  <section class="card" id="sec-perms"><h2>الأذونات</h2>
    ${permRow("الإشعارات", st.notifications, "perm-notif")}
    ${permRow("المنبهات في معادها بالظبط", st.exact, "perm-exact")}
    ${permRow("المنبه يظهر والشاشة مقفولة", st.fullScreen, "perm-full")}
    ${permRow("مايتوقفش عشان توفير البطارية", st.battery, "perm-battery")}
    <p class="hint">لو موبايلك شاومي أو ريلمي أو أوبو: من إعدادات التطبيق فعّل «التشغيل التلقائي» (Autostart) كمان.</p></section>`
  : `<section class="card"><h2>منبه الفجر والتذكيرات</h2><p class="hint">متاحين في تطبيق الأندرويد بس. ${IS_IOS ? "الآيفون مابيسمحش لتطبيقات الويب ترن منبه أو تبعت تذكير في معاد." : "نسخة الويب مابتقدرش ترن منبه أو تبعت تذكير والصفحة مقفولة."}</p>${IS_ANDROID ? `<button class="btn wide" data-act="update">نزّل تطبيق الأندرويد</button>` : ""}</section>`}

  <section class="card"><h2>بياناتك</h2><p class="hint">بياناتك محفوظة على الجهاز ده بس، ومحدش غيرك يقدر يشوفها. عشان تنقلها لجهاز تاني: انسخ نسخة احتياطية هنا والصقها هناك.</p>
    <button class="btn ghost wide" data-act="backup">انسخ نسخة احتياطية</button>
    <textarea id="importbox" rows="3" placeholder="الصق نسخة احتياطية هنا" aria-label="نسخة احتياطية"></textarea>
    <button class="btn wide" data-act="import">استورد</button>
    <button class="btn danger wide" data-act="reset">${confirmDel === "__reset" ? "متأكد؟ دوس تاني وكل حاجة هتتمسح" : "امسح كل حاجة وابدأ من الأول"}</button></section>

  <section class="card"><h2>عن التطبيق</h2><p class="hint">${A ? "النسخة "+esc(st.version || "") : "نسخة الويب · لابتوب وآيفون"}</p>${A ? `<button class="btn ghost wide" data-act="check-update">دوّر على تحديث</button>` : ""}</section>`;
}

/* ---------- render ---------- */
function render(){
  const keep = {};
  ["newtask","taskdue","importbox","welcome-name"].forEach(id => { const el = document.getElementById(id); if(el) keep[id] = el.value });
  status = getStatus();
  if(!S.onboarded) view = "welcome";
  app.innerHTML = view === "welcome" ? welcomeHTML() : view === "settings" ? settingsHTML() : view === "edit" ? editHTML() : todayHTML();
  sheetRoot.innerHTML = sheetHTML();
  Object.entries(keep).forEach(([id,v]) => { const el = document.getElementById(id); if(el) el.value = v });
}
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true }, 2600) }
function focusSel(sel, select){ const el = document.querySelector(sel); if(el){ el.focus(); if(select && el.select) el.select(); el.scrollIntoView({block:"center"}) } }
function armConfirm(id){ confirmDel = id; render(); clearTimeout(confirmT); confirmT = setTimeout(() => { confirmDel = null; if(view !== "today") render() }, 3000) }
function go(v, anchor){ flush(); sheet = null; view = v; render(); if(anchor){ const el = document.getElementById(anchor); if(el) el.scrollIntoView() } else window.scrollTo(0,0) }
function goBack(){
  if(sheet){ sheet = null; render(); return true }
  if(view === "settings" || view === "edit"){ go("today"); return true }
  return false;
}
function copyText(s){
  if(A){ A.copy(s); toast("اتنسخت. الصقها في الجهاز التاني"); return }
  if(navigator.clipboard) navigator.clipboard.writeText(s).then(() => toast("اتنسخت. الصقها في الجهاز التاني"), () => toast("مقدرتش أنسخ"));
}

function doImport(){
  const box = $("#importbox"); let o = null;
  try{ o = JSON.parse(box.value.trim()) }catch(e){}
  if(!o || typeof o !== "object"){ toast("النص ده مش نسخة احتياطية صحيحة"); return }
  let nd = 0, nt = 0;
  for(const [k,v] of Object.entries(o.days || {})){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k)) continue;
    const d = S.days[k] || (S.days[k] = {date:k, checks:{}}); d.checks = d.checks || {};
    for(const [id,val] of Object.entries((v && v.checks) || {})){ if(val === true && !d.checks[id]){ d.checks[id] = true; nd++ } }
  }
  for(const [id,t] of Object.entries(o.tasks || {})){
    if(S.tasks[id] || !t || typeof t.text !== "string") continue;
    S.tasks[id] = {text:t.text, done:!!t.done, createdAt:t.createdAt || Date.now(), doneAt:t.doneAt || null, due:t.due || null}; nt++;
  }
  let extra = "";
  if(Array.isArray(o.groups) && o.settings){
    const code = S.settings.alarm.code;
    const n = normalize({v:o.v, groups:o.groups, settings:o.settings});
    S.groups = n.groups; S.settings = n.settings; S.settings.alarm.code = code;
    ptCache = {}; extra = " والبنود والإعدادات";
  } else if(!S.groups.length && nd){
    S.groups = clone(LEGACY); S.groups.forEach(g => {}); S.groups = normalize({v:2, groups:S.groups}).groups; extra = " والبنود";
  }
  S.onboarded = true;
  save(true); box.value = ""; applyTheme(); render(); toast("اتنقل "+ar(nd)+" علامة و"+ar(nt)+" تاسك"+extra);
}

function checkUpdate(manual){
  if(!A) return;
  let last = 0;
  try{ last = +localStorage.getItem("updChecked") || 0; upd = JSON.parse(localStorage.getItem("upd") || "null") }catch(e){}
  if(!manual && Date.now() - last < 6*3600e3) return;
  fetch("https://api.github.com/repos/mahran20/yawmi/releases/latest", {cache:"no-store"})
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(j => {
      const v = parseInt(String(j.tag_name || "").replace(/\D/g, ""), 10) || 0;
      upd = v > (status.versionCode || 0) ? {v} : null;
      try{ localStorage.setItem("updChecked", String(Date.now())); localStorage.setItem("upd", JSON.stringify(upd)) }catch(e){}
      if(manual) toast(upd ? "فيه نسخة جديدة" : "عندك آخر نسخة");
      render();
    })
    .catch(() => { if(manual) toast("مفيش نت دلوقتي") });
}

/* ---------- events ---------- */
function onClick(e){
  const b = e.target.closest("[data-act]"); if(!b || b.disabled) return;
  const act = b.dataset.act, id = b.dataset.id;
  switch(act){
    /* welcome */
    case "pick-pack": picked[b.dataset.k] = !picked[b.dataset.k]; render(); break;
    case "start": case "start-empty": {
      const v = (($("#welcome-name") || {}).value || "").trim();
      if(v) S.settings.name = v.slice(0,30);
      S.groups = act === "start" ? Object.keys(PACKS).filter(k => picked[k]).map(groupFromPack) : [];
      S.onboarded = true; view = "today"; save(true); render(); window.scrollTo(0,0);
      if(A && !status.notifications && S.groups.length) A.requestNotifications();
      break;
    }
    /* today */
    case "toggle": {
      const k = keyOf(sel); const d = S.days[k] || (S.days[k] = {date:k, checks:{}}); d.checks = d.checks || {};
      if(d.checks[id]) delete d.checks[id]; else d.checks[id] = true;
      save(true); render(); break;
    }
    case "prev": sel.setDate(sel.getDate()-1); render(); break;
    case "next": if(keyOf(sel) !== keyOf(today)){ sel.setDate(sel.getDate()+1); render() } break;
    case "settings": go("settings"); break;
    case "edit": go("edit"); break;
    case "back": goBack(); break;
    case "task-check": { const t = S.tasks[id]; if(!t) break; t.done = !t.done; t.doneAt = t.done ? Date.now() : null; save(true); render(); break }
    case "task-del": delete S.tasks[id]; save(true); render(); break;
    case "toggle-due": showDue = !showDue; render(); if(showDue) focusSel("#taskdue"); break;
    case "fix": { const al = S.settings.alarm; go("settings", status.notifications && al.enabled && !al.code ? "sec-alarm" : "sec-perms"); break }
    case "update": if(A) A.openUrl(APK); else window.open(APK); break;
    case "install": if(installEvt){ installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render() }) } break;
    /* edit */
    case "grp-add": { const g = {id:uid("g"), title:"قسم جديد", icon:null, color:COLORS[S.groups.length % COLORS.length], items:[]}; S.groups.push(g); save(true); render(); focusSel(`[data-input="grp-title"][data-g="${g.id}"]`, true); break }
    case "add-pack": {
      const k = b.dataset.k; if(!PACKS[k]) break;
      const g = groupFromPack(k);
      if(findG(g.id)) g.id = uid("g");
      S.groups.push(g); ptCache = {}; save(true); render(); toast("اتضاف قسم "+PACKS[k].title); break;
    }
    case "grp-del": { const g = b.dataset.g; if(confirmDel !== g){ armConfirm(g); break } S.groups = S.groups.filter(x => x.id !== g); confirmDel = null; save(true); render(); toast("القسم اتمسح"); break }
    case "item-add": { const g = findG(b.dataset.g); if(!g) break; const it = {id:uid("i"), label:"بند جديد", icon:null}; g.items.push(it); save(true); render(); focusSel(`[data-input="item-label"][data-i="${it.id}"]`, true); break }
    case "item-del": {
      const g = findG(b.dataset.g), i = b.dataset.i; if(!g) break;
      if(confirmDel !== i){ armConfirm(i); break }
      g.items = g.items.filter(x => x.id !== i); confirmDel = null; save(true); render(); toast("البند اتمسح"); break;
    }
    case "sheet-group": flush(); sheet = {g:b.dataset.g}; render(); break;
    case "sheet-item": flush(); sheet = {g:b.dataset.g, i:b.dataset.i}; render(); break;
    case "sheet-close": sheet = null; render(); break;
    case "pick-icon": case "pick-color": {
      if(!sheet) break;
      const g = findG(sheet.g); if(!g) break;
      const target = sheet.i ? g.items.find(x => x.id === sheet.i) : g; if(!target) break;
      const v = b.dataset.v || null;
      if(act === "pick-icon") target.icon = v; else target.color = v || (sheet.i ? null : "green");
      save(true); render(); break;
    }
    case "move": {
      if(!sheet) break;
      const g = findG(sheet.g); if(!g) break;
      const list = sheet.i ? g.items : S.groups;
      const target = sheet.i ? g.items.find(x => x.id === sheet.i) : g;
      const i = list.indexOf(target), j = i + (+b.dataset.d);
      if(i < 0 || j < 0 || j >= list.length) break;
      list.splice(i, 1); list.splice(j, 0, target); save(true); render(); break;
    }
    /* settings */
    case "theme-mode": S.settings.theme.mode = b.dataset.v; save(true); applyTheme(); render(); break;
    case "theme-accent": S.settings.theme.accent = b.dataset.v; save(true); applyTheme(); render(); break;
    case "city": S.settings.loc = {name:b.dataset.name, lat:+b.dataset.lat, lng:+b.dataset.lng}; ptCache = {}; save(true); render(); toast("المواقيت على "+b.dataset.name); break;
    case "loc-me":
      if(A){ A.requestLocation(); toast("بجيب موقعك…") }
      else if(navigator.geolocation){ toast("بجيب موقعك…"); navigator.geolocation.getCurrentPosition(pos => window.onNativeLocation({lat:pos.coords.latitude, lng:pos.coords.longitude}), () => window.onNativeLocation(null), {timeout:15000}) }
      else toast("المتصفح ده مش بيدي الموقع");
      break;
    case "pn": { const p = b.dataset.p; S.settings.prayerNotify[p] = !S.settings.prayerNotify[p]; save(true); render(); break }
    case "alarm-enabled": {
      const al = S.settings.alarm; al.enabled = !al.enabled; save(true); render();
      if(al.enabled) toast(al.code ? "المنبه اتظبط" : "سجّل الكود عشان المنبه يشتغل صح");
      break;
    }
    case "nightly-enabled": S.settings.nightly.enabled = !S.settings.nightly.enabled; save(true); render(); break;
    case "scan": if(A) A.scanCode(); break;
    case "test-alarm": if(A){ A.testAlarm(20); toast("المنبه هيرن بعد ٢٠ ثانية. اقفل الشاشة.") } break;
    case "perm-notif": if(A) A.requestNotifications(); break;
    case "perm-exact": if(A) A.openExactAlarmSettings(); break;
    case "perm-full": if(A) A.openFullScreenSettings(); break;
    case "perm-battery": if(A) A.requestBattery(); break;
    case "import": doImport(); break;
    case "backup": flush(); copyText(JSON.stringify(S)); break;
    case "reset": {
      if(confirmDel !== "__reset"){ armConfirm("__reset"); break }
      confirmDel = null; const theme = S.settings.theme;
      S = defaults(); S.settings.theme = theme; picked = {prayers:true, quran:true};
      save(true); applyTheme(); render(); window.scrollTo(0,0); break;
    }
    case "check-update": checkUpdate(true); break;
  }
}
app.addEventListener("click", onClick);
sheetRoot.addEventListener("click", onClick);

app.addEventListener("input", e => {
  const el = e.target, k = el.dataset.input; if(!k) return;
  if(k === "name"){ S.settings.name = el.value.trim().slice(0,30); save() }
  else if(k === "grp-title"){ const g = findG(el.dataset.g); if(g){ g.title = el.value; save() } }
  else if(k === "item-label"){ const it = findI(el.dataset.g, el.dataset.i); if(it){ it.label = el.value; save() } }
});

app.addEventListener("change", e => {
  const el = e.target, k = el.dataset.input; if(!k) return;
  if(k === "item-time"){
    const it = findI(el.dataset.g, el.dataset.i); if(!it) return;
    it.time = el.value || null; save(true);
    if(A) toast(el.value ? "هفكّرك بـ«"+(it.label || "البند")+"» الساعة "+fmt12(el.value) : "اتشال التذكير");
  } else if(k === "alarm-offset"){ S.settings.alarm.offset = +el.value; save(true); render() }
  else if(k === "nightly-time"){ if(el.value){ S.settings.nightly.time = el.value; save(true); toast("هفكّرك الساعة "+fmt12(el.value)) } }
});

app.addEventListener("submit", e => {
  if(e.target.id !== "addform") return;
  e.preventDefault();
  const inp = $("#newtask"); const text = inp.value.trim(); if(!text) return;
  const dueEl = $("#taskdue"); let due = null;
  if(dueEl && dueEl.value){ const t = new Date(dueEl.value).getTime(); if(!isNaN(t)) due = t }
  S.tasks[uid("t")] = {text, done:false, createdAt:Date.now(), doneAt:null, due};
  inp.value = ""; if(dueEl) dueEl.value = ""; showDue = false;
  save(true); render(); focusSel("#newtask");
  if(due) toast(A ? "هفكّرك "+fmtWhen(due) : "المعاد اتسجل");
});

document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden") flush() });

/* ---------- native hooks ---------- */
window.onNativeBack = goBack;
window.onNativeStatus = () => render();
window.onNativeResume = () => {
  flush(); load(); ptCache = {}; applyTheme();
  const t = logicalToday();
  if(keyOf(t) !== keyOf(today)){ if(keyOf(sel) === keyOf(today)) sel = new Date(t); today = t }
  render(); checkUpdate(false);
};
window.onNativeScan = code => {
  if(!code){ toast("ماتسجلش كود"); return }
  S.settings.alarm.code = code; save(true); render();
  toast("الكود اتسجل. المنبه مش هيسكت غير بيه");
};
window.onNativeLocation = loc => {
  if(!loc){ toast("مقدرتش أجيب موقعك. شغّل الـ Location وجرب تاني"); return }
  S.settings.loc = {name:"موقعي", lat:+(+loc.lat).toFixed(4), lng:+(+loc.lng).toFixed(4)};
  ptCache = {}; save(true); render(); toast("المواقيت اتظبطت على موقعك");
};

setInterval(() => {
  if(view !== "today" || sheet) return;
  const a = document.activeElement;
  if(a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA")) return;
  const t = logicalToday();
  if(keyOf(t) !== keyOf(today)){ if(keyOf(sel) === keyOf(today)) sel = new Date(t); today = t }
  render();
}, 30000);

window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if(view === "today") render() });
if(!A && "serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
load(); applyTheme(); render(); checkUpdate(false);
window.__yawmi = {calcTimes, normalize, defaults};
})();
</script>
</body>
</html>
