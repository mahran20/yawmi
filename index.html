<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>يومي</title>
<meta name="theme-color" content="#f2f5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101513" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="يومي">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: one RTL column — date bar, then four stacked sections: prayers (5 tiles), teeth (2), supplements (4), tasks (add + list) */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --ink:#17201b; --muted:#5d6a63; --line:#dbe2dd;
  --accent:#1f6b5c; --accent-soft:#e0eee8; --done:#1f7a4d; --done-soft:#d9efe2;
  --display:"Readex Pro", "Segoe UI", Tahoma, sans-serif;
  --body:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101513; --surface:#19201d; --ink:#e6ece8; --muted:#95a29b; --line:#2a3430;
  --accent:#6cc2ab; --accent-soft:#1c3430; --done:#5fd095; --done-soft:#163428; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101513; --surface:#19201d; --ink:#e6ece8; --muted:#95a29b; --line:#2a3430;
  --accent:#6cc2ab; --accent-soft:#1c3430; --done:#5fd095; --done-soft:#163428; color-scheme:dark}
html{-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:1.8rem;margin:0}
.total{font-family:var(--display);font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;font-size:1.05rem}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px}
.datebar button{background:none;border:0;color:var(--ink);font:inherit;font-size:1.3rem;width:40px;height:40px;border-radius:8px;cursor:pointer}
.datebar button:hover:not(:disabled){background:var(--accent-soft)}
.datebar button:disabled{opacity:.3;cursor:default}
.datelabel{text-align:center}
.datelabel strong{display:block;font-weight:600}
.datelabel span{color:var(--muted);font-size:.85rem}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px}
h2{font-family:var(--display);font-weight:600;font-size:1.05rem;margin:0}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.count.full{color:var(--done);font-weight:600}
.tiles{display:grid;gap:8px}
.t5{grid-template-columns:repeat(5,minmax(0,1fr))}
.t2{grid-template-columns:repeat(2,minmax(0,1fr))}
.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
.t4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:420px){.t4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{font:inherit;font-weight:500;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px 4px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;text-align:center;min-width:0}
.tile .mark{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:transparent}
.tile.on{background:var(--done-soft);border-color:var(--done);color:var(--done)}
.tile.on .mark{background:var(--done);border-color:var(--done);color:var(--surface)}
.tile small{color:var(--muted);font-size:.75rem;font-weight:400}
.tile.on small{color:var(--done)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.add button{font:inherit;font-weight:600;color:var(--surface);background:var(--accent);border:0;border-radius:10px;padding:0 18px;cursor:pointer}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.task{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.task .chk{flex:none;width:26px;height:26px;border-radius:7px;border:2px solid var(--line);background:var(--surface);cursor:pointer;color:transparent;font-weight:700;font-size:.85rem;display:grid;place-items:center}
.task.done .chk{background:var(--done);border-color:var(--done);color:var(--surface)}
.task .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.task.done .txt{color:var(--muted);text-decoration:line-through}
.task .del{flex:none;background:none;border:0;color:var(--muted);font:inherit;font-size:.85rem;cursor:pointer;padding:4px 6px;border-radius:6px}
.task .del:hover{background:var(--accent-soft)}
.empty{color:var(--muted);font-size:.9rem;margin:0}
details summary{cursor:pointer;color:var(--muted);font-size:.9rem;padding:4px 0}
details ul{margin-top:6px}
.status{font-size:.85rem;color:var(--muted);min-height:1.2em;text-align:center}
.foot{color:var(--muted);font-size:.82rem;margin:0;text-align:center}
@media (prefers-reduced-motion:no-preference){.tile,.task .chk{transition:background-color .15s,border-color .15s}}
</style>
</head>
<body>
<div class="wrap" dir="rtl" lang="ar">
  <header>
    <h1>يومي</h1>
    <div class="total" id="total">0 / 15</div>
  </header>

  <div class="datebar">
    <button id="prev" aria-label="اليوم اللي قبله">›</button>
    <div class="datelabel"><strong id="dlabel">النهارده</strong><span id="dsub"></span></div>
    <button id="next" aria-label="اليوم اللي بعده">‹</button>
  </div>

  <section class="card" aria-labelledby="h-pr">
    <div class="head"><h2 id="h-pr">الصلوات</h2><span class="count" id="c-prayers"></span></div>
    <div class="tiles t5" id="g-prayers"></div>
  </section>

  <section class="card" aria-labelledby="h-dh">
    <div class="head"><h2 id="h-dh">القرآن والأذكار</h2><span class="count" id="c-dhikr"></span></div>
    <div class="tiles t3" id="g-dhikr"></div>
  </section>

  <section class="card" aria-labelledby="h-te">
    <div class="head"><h2 id="h-te">غسيل السنان</h2><span class="count" id="c-teeth"></span></div>
    <div class="tiles t2" id="g-teeth"></div>
  </section>

  <section class="card" aria-labelledby="h-su">
    <div class="head"><h2 id="h-su">التمرين والمكملات</h2><span class="count" id="c-supps"></span></div>
    <div class="tiles t5" id="g-supps"></div>
  </section>

  <section class="card" aria-labelledby="h-ta">
    <div class="head"><h2 id="h-ta">تاسكات ومشاوير</h2><span class="count" id="c-tasks"></span></div>
    <form class="add" id="addform">
      <input id="newtask" type="text" placeholder="ضيف تاسك… كشف دكتور، مشوار، حاجة تشتريها" autocomplete="off" maxlength="200" aria-label="تاسك جديد">
      <button type="submit">ضيف</button>
    </form>
    <ul id="open"></ul>
    <details id="donebox" hidden><summary id="donesum">اتعملت</summary><ul id="donelist"></ul></details>
  </section>

    <p class="foot">اللي تعلّم عليه قبل الساعة ٤ الفجر بيتحسب على اليوم اللي فات. التاسكات مش مربوطة بيوم، بتفضل لحد ما تخلصها. كل حاجة محفوظة على موبايلك وشغالة من غير نت.</p>
</div>

<script>
const GROUPS={
  prayers:[["fajr","الفجر"],["dhuhr","الظهر"],["asr","العصر"],["maghrib","المغرب"],["isha","العشاء"]],
  dhikr:[["quran","ورد القرآن","الورد اليومي"],["adhkar_am","أذكار الصباح"],["adhkar_pm","أذكار المساء"]],
  teeth:[["teeth_am","الصبح","أول ما أصحى"],["teeth_pm","بالليل","قبل ما أنام"]],
  supps:[["train","التمرين"],["creatine","كرياتين"],["protein","بروتين"],["carbs","كارب"],["pills","البرشام","فيتامينات، زنك، أوميجا"]]
};
const ALL=Object.values(GROUPS).flat().map(x=>x[0]);
let days={}, tasks={};

const pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
function logicalToday(){const d=new Date(); if(d.getHours()<4) d.setDate(d.getDate()-1); d.setHours(12,0,0,0); return d}
let today=logicalToday(); let sel=new Date(today);
const ar=(d,o)=>d.toLocaleDateString("ar-EG",o);
const num=n=>n.toLocaleString("ar-EG");

function saveLocal(){try{localStorage.setItem("dc2",JSON.stringify({days,tasks}))}catch(e){}}
function queue(){saveLocal()}

function renderDate(){
  const diff=Math.round((today-sel)/864e5);
  document.getElementById("dlabel").textContent=diff===0?"النهارده":diff===1?"امبارح":ar(sel,{weekday:"long"});
  document.getElementById("dsub").textContent=ar(sel,{weekday:"short",day:"numeric",month:"long"});
  document.getElementById("next").disabled=diff<=0;
}

function renderTiles(){
  const rec=(days[key(sel)]||{}).checks||{};
  let total=0;
  for(const [g,items] of Object.entries(GROUPS)){
    const box=document.getElementById("g-"+g); box.innerHTML="";
    let c=0;
    items.forEach(([k,label,sub])=>{
      const on=!!rec[k]; if(on) c++;
      const b=document.createElement("button");
      b.className="tile"+(on?" on":""); b.id="t-"+k; b.type="button";
      b.setAttribute("aria-pressed",on?"true":"false");
      b.innerHTML='<span class="mark">✓</span><span class="lb"></span>'+(sub?'<small></small>':'');
      b.querySelector(".lb").textContent=label; if(sub) b.querySelector("small").textContent=sub;
      b.onclick=()=>toggle(k);
      box.appendChild(b);
    });
    total+=c;
    const ce=document.getElementById("c-"+g);
    ce.textContent=num(c)+" / "+num(items.length); ce.classList.toggle("full",c===items.length);
  }
  document.getElementById("total").textContent=num(total)+" / "+num(ALL.length);
}

function toggle(k){
  const id=key(sel);
  const rec={date:id,checks:Object.assign({},(days[id]||{}).checks||{})};
  if(rec.checks[k]) delete rec.checks[k]; else rec.checks[k]=true;
  days[id]=rec; renderTiles();
  queue();
}

function taskRow(id,t){
  const li=document.createElement("li"); li.className="task"+(t.done?" done":"");
  li.innerHTML='<button class="chk" type="button">✓</button><span class="txt"></span><button class="del" type="button">مسح</button>';
  li.querySelector(".txt").textContent=t.text;
  const chk=li.querySelector(".chk");
  chk.setAttribute("aria-label",(t.done?"رجّع: ":"خلصت: ")+t.text);
  chk.setAttribute("aria-pressed",t.done?"true":"false");
  chk.onclick=()=>setTask(id,Object.assign({},t,{done:!t.done,doneAt:t.done?null:Date.now()}));
  li.querySelector(".del").setAttribute("aria-label","امسح: "+t.text);
  li.querySelector(".del").onclick=()=>{delete tasks[id]; renderTasks(); queue()};
  return li;
}

function renderTasks(){
  const entries=Object.entries(tasks);
  const open=entries.filter(([,t])=>!t.done).sort((a,b)=>a[1].createdAt-b[1].createdAt);
  const done=entries.filter(([,t])=>t.done).sort((a,b)=>(b[1].doneAt||0)-(a[1].doneAt||0));
  const ul=document.getElementById("open"); ul.innerHTML="";
  if(!open.length){const p=document.createElement("p");p.className="empty";p.textContent="مفيش حاجة مستنياك. ضيف أي مشوار أو تاسك يجدّ في يومك.";ul.appendChild(p)}
  open.forEach(([id,t])=>ul.appendChild(taskRow(id,t)));
  const dl=document.getElementById("donelist"); dl.innerHTML="";
  done.forEach(([id,t])=>dl.appendChild(taskRow(id,t)));
  document.getElementById("donebox").hidden=!done.length;
  document.getElementById("donesum").textContent="اتعملت ("+num(done.length)+")";
  document.getElementById("c-tasks").textContent=open.length?num(open.length)+" فاضلين":"";
}

function setTask(id,t){tasks[id]=t; renderTasks(); queue()}

document.getElementById("addform").addEventListener("submit",e=>{
  e.preventDefault();
  const inp=document.getElementById("newtask"); const text=inp.value.trim(); if(!text) return;
  const id="t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  setTask(id,{text,done:false,createdAt:Date.now(),doneAt:null});
  inp.value=""; inp.focus();
});
document.getElementById("prev").onclick=()=>{sel.setDate(sel.getDate()-1);renderDate();renderTiles()};
document.getElementById("next").onclick=()=>{if(sel<today){sel.setDate(sel.getDate()+1);renderDate();renderTiles()}};

try{const s=JSON.parse(localStorage.getItem("dc2")||"null"); if(s){days=s.days||{};tasks=s.tasks||{}}}catch(e){}
renderDate(); renderTiles(); renderTasks();


document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState!=="visible") return;
  const t=logicalToday();
  if(key(t)!==key(today)){const wasToday=key(sel)===key(today); today=t; if(wasToday) sel=new Date(today); renderDate(); renderTiles();}
});
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
