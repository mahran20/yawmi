<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>يومي</title>
<meta name="description" content="يومي: يومك بيبدأ من الفجر. منبه فجر، وعاداتك ومهامك بمواعيدك انت.">
<meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1324" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="يومي">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
@font-face{font-family:"Plex Ar";src:url(fonts/plex-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Plex Ar";src:url(fonts/plex-500.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Plex Ar";src:url(fonts/plex-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Readex";src:url(fonts/readex-600.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Readex";src:url(fonts/readex-700.woff2) format("woff2");font-weight:700;font-display:swap}
/* Layout: one RTL column. Views: onboarding, today, edit (your space), reports, settings. A bottom sheet edits look, schedule and tasks. */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --ink:#141a2e; --muted:#5e6680; --line:#dde2ec;
  --accent-ink:#ffffff; --warn:#8a5410; --warn-soft:#fbefd9; --danger:#b4432f; --danger-soft:#f8e3de;
  --h-night:#24346b; --h-green:#1f6b5c; --h-teal:#0e6f7a; --h-blue:#2457a6; --h-purple:#6a43a8; --h-rose:#a83a5c; --h-amber:#93590c; --h-orange:#b8521c; --h-gray:#59607a;
  --dawn:#e0892f; --dawn-soft:#fbeedd;
  --accent:var(--h-night);
  --accent-soft:color-mix(in srgb,var(--accent) 13%,var(--surface));
  --display:"Readex","Segoe UI",Tahoma,sans-serif; --body:"Plex Ar","Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0e1324; --surface:#171d33; --ink:#e8ecf6; --muted:#98a1bc; --line:#262e48;
  --accent-ink:#0e1324; --warn:#f0bf6e; --warn-soft:#3a2c14; --danger:#ee8a76; --danger-soft:#3b211c;
  --h-night:#a9bbf2; --h-green:#6cc2ab; --h-teal:#62c6d1; --h-blue:#86aef0; --h-purple:#b99be9; --h-rose:#ef8fae; --h-amber:#efb560; --h-orange:#f2995f; --h-gray:#a3aac0;
  --dawn:#f4b266; --dawn-soft:#3a2a17;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
#app{max-width:600px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:1.45rem;font-weight:700}
h2{font-size:1.02rem;font-weight:600}
h3{font-size:.92rem;font-weight:600;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top .sub{color:var(--muted);font-size:.88rem;margin:0}
.top .acts{display:flex;gap:6px}
.iconbtn{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);flex:none;padding:0}
.iconbtn svg{width:21px;height:21px}
.iconbtn.sm{width:38px;height:38px;border-radius:10px;font-size:1.05rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gtitle{display:flex;align-items:center;gap:10px;min-width:0}
.gicon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:1.1rem;flex:none;background:color-mix(in srgb,var(--c,var(--accent)) 15%,var(--surface));color:var(--c,var(--accent))}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;white-space:nowrap}
.count.full{color:var(--c,var(--accent));font-weight:600}
.hint{color:var(--muted);font-size:.86rem;margin:0}
.prayerbar{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.np{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.np strong{font-family:var(--display);font-size:1.25rem;font-weight:700}
.np .left{font-size:.92rem;opacity:.9}
.np-label,.alarmline{font-size:.84rem;opacity:.9}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px}
.datebar button{background:none;border:0;font-size:1.3rem;width:42px;height:42px;border-radius:9px}
.datelabel{text-align:center}
.datelabel strong{display:block;font-weight:600}
.datelabel span{color:var(--muted);font-size:.85rem}
.tiles{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
.tiles.cols5{grid-template-columns:repeat(5,minmax(0,1fr))}
.tile{position:relative;font-weight:500;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 4px;min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-align:center;min-width:0}
.tile .lb{overflow-wrap:anywhere}
.tile .mark{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:transparent}
.tile .emo{font-size:1.25rem;line-height:1.2}
.tile .badge{position:absolute;top:6px;left:6px;width:18px;height:18px;border-radius:50%;display:none;place-items:center;font-size:.65rem;font-weight:700;background:var(--c,var(--accent));color:var(--surface)}
.tile small{color:var(--muted);font-size:.74rem;font-weight:400;font-variant-numeric:tabular-nums}
.tile.on{background:color-mix(in srgb,var(--c,var(--accent)) 14%,var(--surface));border-color:var(--c,var(--accent));color:var(--c,var(--accent))}
.tile.on .mark{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--surface)}
.tile.on .badge{display:grid}
.tile.on small{color:var(--c,var(--accent))}
.tile.met:not(.on){border-style:dashed;opacity:.75}
.offrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;border-top:1px dashed var(--line);padding-top:10px}
.offrow .hint{font-size:.8rem}
.offchip{border:1px dashed var(--line);background:none;border-radius:999px;padding:3px 10px;font-size:.82rem;color:var(--muted)}
.offchip.on{border-style:solid;border-color:var(--c,var(--accent));color:var(--c,var(--accent))}
.btn{border:0;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:10px 16px;min-height:42px}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.9rem}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.wide{width:100%}
.btn.link{background:none;color:var(--muted);font-weight:500;text-decoration:underline;text-underline-offset:3px}
.inp,select,textarea{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;font-size:.85rem;direction:ltr;text-align:left}
.add{display:flex;gap:8px;align-items:center}
.add .inp{flex:1}
.duebox{display:flex;flex-direction:column;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px}
.duegrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.duegrid label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
.duegrid .inp{background:var(--surface)}
.check{display:flex;align-items:center;gap:8px;font-size:.9rem}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.task{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:11px;background:var(--bg)}
.task .chk{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:transparent;font-weight:700;font-size:.85rem;display:grid;place-items:center}
.task.done .chk{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.task .txt{flex:1;min-width:0;overflow-wrap:anywhere;display:flex;flex-direction:column;background:none;border:0;padding:0;text-align:start}
.task .txt small{color:var(--muted);font-size:.8rem}
.task .txt small.late{color:var(--danger);font-weight:600}
.task .txt small.soon{color:var(--warn);font-weight:600}
.task.done .txt span{color:var(--muted);text-decoration:line-through}
.task .del{flex:none;background:none;border:0;color:var(--muted);font-size:.85rem;padding:6px;border-radius:6px}
.empty{color:var(--muted);font-size:.9rem;margin:0}
details summary{cursor:pointer;color:var(--muted);font-size:.9rem;padding:4px 0}
details ul{margin-top:6px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:.9rem}
.banner.up{background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:.88rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.days{display:flex;flex-wrap:wrap;gap:6px}
.days .chip{padding:6px 11px;font-size:.84rem}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.opt{display:flex;align-items:center;gap:10px;text-align:start;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-weight:500}
.opt .e{font-size:1.25rem}
.opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.dots{display:flex;gap:6px;justify-content:center}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--accent);width:20px;border-radius:4px}
.navrow{display:flex;gap:8px}
.navrow .btn{flex:1}
.review{display:flex;flex-direction:column;gap:6px}
.review .rg{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.review .rg:last-child{border-bottom:0}
.review .rg p{margin:0;font-size:.85rem;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:42px}
.row > span{min-width:0}
.ok{color:var(--accent);font-weight:600;font-size:.9rem;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.88rem;color:var(--muted)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:500;font-size:.88rem}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.stepper{display:flex;align-items:center;gap:10px}
.stepper strong{font-variant-numeric:tabular-nums;min-width:5ch;text-align:center}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--surface);background:var(--c);box-shadow:0 0 0 1px var(--line);padding:0;display:grid;place-items:center;color:var(--surface);font-weight:700}
.sw.on{box-shadow:0 0 0 2px var(--c)}
.sw.none{width:auto;padding:0 12px;border-radius:999px;background:var(--bg);color:var(--muted);font-size:.8rem;white-space:nowrap}
.switch{position:relative;width:52px;height:30px;border-radius:999px;border:0;background:var(--line);flex:none;padding:0}
.switch span{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch.on{background:var(--accent)}
.switch.on span{transform:translateX(-22px)}
.ge{display:flex;flex-direction:column;gap:8px}
.ge-head{display:flex;align-items:center;gap:8px}
.ge-head .inp{font-weight:600}
.pickbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;font-size:1.05rem;flex:none;padding:0;background:color-mix(in srgb,var(--c,var(--accent)) 15%,var(--surface));color:var(--c,var(--accent))}
.ie{display:grid;grid-template-columns:38px minmax(0,1fr) 108px 38px;gap:6px;align-items:center}
.ie .time{padding:8px 6px;font-size:.88rem}
.ie .sched{grid-column:2 / 5;margin-top:-4px;font-size:.78rem;color:var(--muted);background:none;border:0;padding:0;text-align:start}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:8}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;max-width:600px;margin:0 auto}
.emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.emojis button{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:1.3rem;padding:0}
.emojis button.on{border-color:var(--accent);background:var(--accent-soft)}
/* reports */
.kpi{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.kpi strong{font-family:var(--display);font-size:2.6rem;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.delta{font-size:.85rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--bg)}
.delta.up{color:var(--accent)}
.delta.down{color:var(--danger)}
.chart{display:flex;flex-direction:column;gap:4px}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;border-bottom:1px solid var(--line);direction:ltr}
.bars .b{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars .b span{display:block;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.bars .b.zero span{background:var(--line)}
.axis{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);direction:ltr;font-variant-numeric:tabular-nums}
.insights{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.insights div{background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.insights small{color:var(--muted);font-size:.78rem}
.insights b{font-weight:600;overflow-wrap:anywhere}
.rlist{display:flex;flex-direction:column;gap:10px}
.ritem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.ritem .nm{display:flex;gap:6px;align-items:center;min-width:0;overflow-wrap:anywhere}
.ritem .pc{font-variant-numeric:tabular-nums;font-weight:600;font-size:.9rem}
.ritem .meter{grid-column:1 / 3;height:8px;border-radius:999px;background:var(--bg);overflow:hidden}
.ritem .meter span{display:block;height:100%;background:var(--c,var(--accent));border-radius:999px}
.ritem small{grid-column:1 / 3;color:var(--muted);font-size:.78rem;margin-top:-2px}
.range{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.range label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted)}
/* Fajr hero: the dawn sky, same in both themes on purpose */
.fajr{border-radius:20px;padding:16px;color:#fff;background:linear-gradient(170deg,#141c38 0%,#24346b 55%,#6d4d63 85%,#c9783a 118%);display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 24px rgba(20,28,56,.18)}
.fajr .r1{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.fajr .lbl{font-size:.84rem;opacity:.85;display:block}
.fajr .big{font-family:var(--display);font-size:1.75rem;font-weight:700;line-height:1.2}
.fajr .left{font-size:.9rem;opacity:.9}
.fajr .st{font-weight:600;color:#f4b266}
.fdots{display:flex;gap:6px;align-items:center}
.fdots span{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.3);display:grid;place-items:center;font-size:.62rem;color:rgba(255,255,255,.75)}
.fdots span.ok{background:#f4b266;border-color:#f4b266;color:#1b2547;font-weight:700}
.fdots span.late{border-color:#f4b266;background:rgba(244,178,102,.22);color:#fff}
.fdots span.now{box-shadow:0 0 0 2px #141c38,0 0 0 4px rgba(255,255,255,.7)}
.fmeta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.85rem;opacity:.95}
.fmeta b{color:#f4b266;font-weight:600}
.fbtns{display:flex;gap:8px;flex-wrap:wrap}
.fbtn{border:0;border-radius:11px;padding:9px 14px;font-weight:600;background:#f4b266;color:#141c38;min-height:40px}
.fbtn.ghost{background:rgba(255,255,255,.14);color:#fff}
.fchal{display:flex;flex-direction:column;gap:6px;font-size:.85rem}
.fchal .bar{height:8px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden}
.fchal .bar span{display:block;height:100%;background:#f4b266;border-radius:999px}
.nextp{font-size:.84rem;opacity:.85;border-top:1px solid rgba(255,255,255,.15);padding-top:10px}
.tile .qbar{position:absolute;left:0;bottom:0;height:4px;background:var(--c,var(--accent));border-radius:0 0 0 12px}
.tile .st{font-size:.72rem;color:var(--dawn);font-weight:600}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,15px);grid-auto-columns:15px;gap:3px;direction:ltr;overflow-x:auto;padding-bottom:4px}
.heat i{border-radius:4px;background:var(--bg);border:1px solid var(--line)}
.heat i.d{background:var(--c,var(--accent));border-color:transparent}
.heat i.o{background:transparent;border-style:dashed;opacity:.6}
.heat i.f{visibility:hidden}
.legend{display:flex;gap:12px;font-size:.78rem;color:var(--muted);align-items:center;flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-inline-end:4px;vertical-align:-1px;border:1px solid var(--line);background:var(--bg)}
.legend i.d{background:var(--c,var(--accent));border-color:transparent}
.legend i.o{border-style:dashed;background:transparent}
.fcard{border-color:color-mix(in srgb,var(--dawn) 45%,var(--line))}
.fcard .kpi strong{color:var(--dawn)}
.ritem.click{cursor:pointer;background:none;border:0;padding:0;text-align:start;width:100%;color:inherit}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.92rem;max-width:calc(100% - 32px);text-align:center;z-index:10;box-shadow:0 6px 20px rgba(0,0,0,.18)}
@media (prefers-reduced-motion:no-preference){.tile,.task .chk,.chip,.opt,.seg button{transition:background-color .15s,border-color .15s}}
</style>
</head>
<body>
<main id="app"></main>
<div id="sheet-root"></div>
<div class="toast" id="toast" hidden></div>
<script>
(function(){
"use strict";
const A = window.Android || null;
const app = document.getElementById("app");
const sheetRoot = document.getElementById("sheet-root");
const $ = s => document.querySelector(s);
const AR = "٠١٢٣٤٥٦٧٨٩";
const ar = s => String(s).replace(/\d/g, d => AR[d]);
const pad = n => String(n).padStart(2,"0");
const keyOf = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d, 12) };

function challengeInfo(){

  return {day: Math.min(day, 40), prayed, done: day > 40};
}

function permIssue(){
  if(!A) return null;

  const anyReminder = hasPrayers() || S.settings.nightly.enabled || al.enabled || S.groups.some(g => g.items.some(i => i.time)) || Object.values(S.tasks).some(t => !t.done && t.due);

  if((al.enabled || Object.values(S.tasks).some(t => !t.done && t.ring)) && !status.exact) return "المنبه مش هيرن في معاده بالظبط. فعّل «المنبهات والتذكيرات»";

  }

}
function itemById(id){ for(const g of S.groups) for(const i of g.items) if(i.id === id) return i; return null }
function dayCounts(d){
  const rec = (S.days[keyOf(d)] || {}).checks || {};
  let total = 0, done = 0;
  for(const g of S.groups) for(const i of g.items){
    const s = schedOf(g, i);
    if(s && s.type === "weekly"){ if(rec[i.id]){ total++; done++ } continue }
    if(!scheduledOn(s, d)) continue;
    total++; if(rec[i.id]) done++;
  }
  return {total, done};
}

function readDue(p){
  const dEl = document.getElementById(p+"-date"), tEl = document.getElementById(p+"-time");
  const r = {due:null, dateOnly:false, ring:false, nag:true};

    if(tEl && tEl.value){ const t = new Date(dEl.value+"T"+tEl.value).getTime(); if(!isNaN(t)) r.due = t }
    else { const t = new Date(dEl.value+"T09:00").getTime(); if(!isNaN(t)){ r.due = t; r.dateOnly = true } }

/* ---------- reports ---------- */
function periodRange(p){
  const t = new Date(today);
  if(p === "week"){ return [weekStartOf(t), t] }
  if(p === "lastweek"){ const s = weekStartOf(t); s.setDate(s.getDate()-7); const e = new Date(s); e.setDate(e.getDate()+6); return [s, e] }
  if(p === "month"){ return [new Date(t.getFullYear(), t.getMonth(), 1, 12), t] }
  if(p === "lastmonth"){ return [new Date(t.getFullYear(), t.getMonth()-1, 1, 12), new Date(t.getFullYear(), t.getMonth(), 0, 12)] }
  if(p === "30"){ const s = new Date(t); s.setDate(s.getDate()-29); return [s, t] }
  const a = rp.from ? fromKey(rp.from) : new Date(t), b = rp.to ? fromKey(rp.to) : new Date(t);
  return a <= b ? [a, b] : [b, a];
}
function daysBetween(a, b){ const out = []; const x = new Date(a); x.setHours(12,0,0,0); const e = new Date(b); e.setHours(12,0,0,0); while(x <= e){ out.push(new Date(x)); x.setDate(x.getDate()+1) } return out }
function computeReport(from, to){
  const end = to > today ? new Date(today) : new Date(to);
  const fd = firstDay();
  const start = from < fd ? fd : new Date(from);
  const days = start <= end ? daysBetween(start, end) : [];
  const items = [], groups = [];
  let reqAll = 0, doneAll = 0;
  for(const g of S.groups){
    let gr = 0, gd = 0;
    for(const i of g.items){
      const s = schedOf(g, i);
      const born = i.createdAt ? dayOf(i.createdAt) : (g.createdAt ? dayOf(g.createdAt) : null);
      const ds = born ? days.filter(d => d >= born) : days;
      if(!ds.length) continue;
      const chk = d => !!(((S.days[keyOf(d)] || {}).checks || {})[i.id]);
      let req = 0, done = 0, streak = 0;
      if(s && s.type === "weekly"){
        const weeks = {};

  const P = computeReport(pa, pb);

  const periods = [["week","الأسبوع ده"],["lastweek","الأسبوع اللي فات"],["month","الشهر ده"],["lastmonth","الشهر اللي فات"],["30","آخر ٣٠ يوم"],["custom","فترة تانية"]];

  if(!R.days.length || R.req === 0) return head + `<section class="card"><p class="empty">مفيش بيانات في الفترة دي لسه. علّم على بنودك كام يوم وارجع هنا.</p></section>`;

  const sorted = R.items.slice().sort((x,y) => x.pct - y.pct || y.req - x.req);
  const weakest = sorted[0], strongest = sorted[sorted.length-1];
  const bestStreak = R.items.filter(x => !x.weekly).sort((x,y) => y.streak - x.streak)[0];
  const dows = R.dowAvg.slice().sort((x,y) => y.avg - x.avg);
  const ins = [];
  if(strongest) ins.push(["أقوى بند", `${esc(strongest.i.label)} · ${pctTxt(strongest.pct)}`]);
  if(weakest && weakest !== strongest) ins.push(["محتاج اهتمام", `${esc(weakest.i.label)} · ${pctTxt(weakest.pct)}`]);
  if(bestStreak && bestStreak.streak >= 2) ins.push(["أطول سلسلة شغالة", `${esc(bestStreak.i.label)} · ${ar(bestStreak.streak)} مرات ورا بعض`]);
  if(dows.length >= 3) ins.push(["أحسن يوم", `${DOW[dows[0].k]} · ${pctTxt(dows[0].avg)}`], ["أضعف يوم", `${DOW[dows[dows.length-1].k]} · ${pctTxt(dows[dows.length-1].avg)}`]);

  let bars = R.series, label = "يوم";
  if(bars.length > 35){
    const wk = {}; bars.forEach(x => { const k = keyOf(weekStartOf(x.d)); (wk[k] = wk[k] || {d:weekStartOf(x.d), total:0, done:0}); wk[k].total += x.total; wk[k].done += x.done });
    bars = Object.values(wk).map(x => ({d:x.d, pct: x.total ? x.done/x.total : null})); label = "أسبوع";
  }

  let fajrCard = "";
  if(fajrTracked()){
    const fd = R.days; const prayed = fd.filter(d => fajrState(keyOf(d))); const ontime = prayed.filter(d => fajrState(keyOf(d)) !== "late");
    const mosque = prayed.filter(d => fajrState(keyOf(d)) === "mosque").length;
    const wakes = fd.map(d => fajrWake(keyOf(d))).filter(Boolean).map(hm => { const [h,m] = hm.split(":").map(Number); return h*60+m });
    const avg = wakes.length ? Math.round(wakes.reduce((a,b) => a+b, 0)/wakes.length) : null;
    let best = 0, cur = 0; fd.forEach(d => { if(fajrState(keyOf(d))){ cur++; best = Math.max(best, cur) } else cur = 0 });
    fajrCard = `<section class="card fcard"><h2>🌅 الفجر</h2><div class="kpi"><strong>${fd.length ? pctTxt(prayed.length/fd.length) : "—"}</strong><span class="hint">صليته ${ar(prayed.length)} من ${ar(fd.length)} يوم</span></div>
      <div class="insights"><div><small>في وقته</small><b>${ar(ontime.length)}</b></div><div><small>في المسجد</small><b>${ar(mosque)}</b></div><div><small>أطول سلسلة</small><b>${ar(best)}</b></div>${avg !== null ? `<div><small>متوسط صحيانك</small><b>${fmt12(pad(Math.floor(avg/60))+":"+pad(avg%60))}</b></div>` : ""}</div></section>`;

  const itemsHTML = sorted.map(x => `<button class="ritem click" data-act="hist" data-g="${esc(x.g.id)}" data-i="${esc(x.i.id)}" style="${cvar(x.i.color || x.g.color)}"><span class="nm">${x.i.icon ? esc(x.i.icon) : ""} ${esc(x.i.label)}</span><span class="pc">${pctTxt(x.pct)}</span><div class="meter"><span style="width:${Math.round(x.pct*100)}%"></span></div><small>${ar(x.done)} من ${ar(x.req)}${x.weekly ? " (هدف أسبوعي)" : ""}${!x.weekly && x.streak >= 2 ? " · سلسلة "+ar(x.streak) : ""}</small></button>`).join("");

  return head + `<section class="card"><h3>${shortDate(R.start)} – ${shortDate(R.end)}</h3><div class="kpi"><strong>${pctTxt(R.pct)}</strong><span class="hint">${ar(R.done)} من ${ar(R.req)} اتعمل</span>${delta !== null ? `<span class="delta ${delta >= 0 ? "up" : "down"}">${delta >= 0 ? "↑" : "↓"} ${ar(Math.abs(delta))} نقطة عن الفترة اللي قبلها</span>` : ""}</div>${chart}</section>
  ${fajrCard}
  ${ins.length ? `<section class="card"><h2>الخلاصة</h2><div class="insights">${ins.map(([k,v]) => `<div><small>${k}</small><b>${v}</b></div>`).join("")}</div></section>` : ""}
  <section class="card"><h2>الأقسام</h2><div class="rlist">${groupsHTML}</div></section>
  <section class="card"><h2>كل البنود</h2><p class="hint">من الأضعف للأقوى. دوس على أي بند عشان تشوف تاريخه. الأيام اللي مش مطلوبة والإجازات مش محسوبة عليك.</p><div class="rlist">${itemsHTML}</div></section>
  <section class="card"><h2>التاسكات</h2><div class="insights"><div><small>خلصت</small><b>${ar(R.tasksDone)}</b></div><div><small>اتضافت</small><b>${ar(R.tasksAdded)}</b></div><div><small>متأخرة دلوقتي</small><b>${ar(R.overdue)}</b></div></div></section>
  <button class="btn ghost wide" data-act="rp-copy">انسخ التقرير كنص</button>`;
}
function reportText(){
  const [a, b] = periodRange(rp.period); const R = computeReport(a, b);
  const lines = ["تقرير يومي: "+shortDate(R.start)+" – "+shortDate(R.end)];
  if(fajrTracked()){ const pr = R.days.filter(d => fajrState(keyOf(d))).length; lines.push("🌅 الفجر: "+ar(pr)+" من "+ar(R.days.length)+" يوم") }
  lines.push("الإنجاز: "+pctTxt(R.pct)+" ("+ar(R.done)+" من "+ar(R.req)+")", "");

    <button class="btn danger wide" data-act="reset">${confirmDel === "__reset" ? "متأكد؟ دوس تاني وكل حاجة هتتمسح" : "امسح كل حاجة وابدأ من الأول"}</button></section>

  <section class="card"><h2>عن التطبيق</h2><p class="hint">${A ? "النسخة "+esc(st.version || "") : "نسخة الويب · لابتوب وآيفون"}</p>${A ? `<button class="btn ghost wide" data-act="check-update">دوّر على تحديث</button>` : ""}<a class="btn link" href="${PRIVACY}" target="_blank" rel="noopener">سياسة الخصوصية</a></section>`;
}

/* ---------- anonymous counter ---------- */
function platform(){ return A ? "android-app" : IS_IOS ? "iphone" : IS_ANDROID ? "android-web" : "laptop" }
function ping(path){
  if(!GC || !S.settings.analytics || navigator.onLine === false) return;
  try{ const img = new Image(); img.src = GC+"?p="+encodeURIComponent(path)+"&t=yawmi&rnd="+Math.random().toString(36).slice(2) }catch(e){}
}
/* Anonymous error counts: only the error type, the app version and the line, never a message or data. */
function appVer(){ return A ? "v"+((status && status.versionCode) || "") : "web" }
function reportError(kind, where){
  const key = kind+"@"+where, today = keyOf(new Date());
  let sent = {}; try{ sent = JSON.parse(localStorage.getItem("errSent") || "{}") }catch(e){}
  if(sent[key] === today) return;
  sent[key] = today; try{ localStorage.setItem("errSent", JSON.stringify(sent)) }catch(e){}
  if(S) ping("/error/"+appVer()+"/"+kind+"@"+where);
}
window.addEventListener("error", e => { const er = e.error; reportError(((er && er.name) || "Error").replace(/\W/g, "").slice(0, 30), (e.lineno || 0)+":"+(e.colno || 0)) });
window.addEventListener("unhandledrejection", e => { const r = e.reason; reportError(((r && r.name) || "Rejection").replace(/\W/g, "").slice(0, 30), "promise") });
function reportCrash(){
  if(!A || !A.lastCrash) return;
  let c = ""; try{ c = A.lastCrash() }catch(e){}
  if(c) ping("/crash/"+appVer()+"/"+c.replace(/[^\w.:@ -]/g, "").slice(0, 100));
}
function track(){
  if(!GC || !S.settings.analytics || navigator.onLine === false) return;
  const m = S.meta || (S.meta = {}); m.sent = Array.isArray(m.sent) ? m.sent : [];
  const now = Date.now(), k = keyOf(new Date());
  let changed = false;
  if(!m.counted){ m.counted = true; if(!m.installAt) m.installAt = now; ping("/install/"+platform()); changed = true }
  if(m.lastPing !== k){
    m.lastPing = k; ping("/active/"+platform());
    const days = Math.floor((now - m.installAt) / 864e5);
    for(const [w,d] of [[1,7],[2,14],[4,28],[8,56]]){
      const tag = "w"+w;
      if(days >= d && days < d + 7 && !m.sent.includes(tag)){ m.sent.push(tag); ping("/retained/"+tag) }
    }
    changed = true;
  }
  if(changed) save(true);
}

/* ---------- render ---------- */
const KEEP = ["newtask","new-date","new-time","new-ring","new-nag","importbox","ts-text","ts-date","ts-time","ts-ring","ts-nag","ob-name","snap"];
function render(){
  const keep = {};
  KEEP.forEach(id => { const el = document.getElementById(id); if(el) keep[id] = el.type === "checkbox" ? el.checked : el.value });
  status = getStatus();
  if(!S.onboarded && !ob) ob = newOb("first");
  const v = ob ? "ob" : view;
  app.innerHTML = v === "ob" ? obHTML() : v === "settings" ? settingsHTML() : v === "edit" ? editHTML() : v === "reports" ? reportsHTML() : todayHTML();
  sheetRoot.innerHTML = sheetHTML();
  Object.entries(keep).forEach(([id,v]) => { const el = document.getElementById(id); if(el){ if(el.type === "checkbox") el.checked = v; else el.value = v } });
}
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true }, 2600) }
function focusSel(sel, select){ const el = document.querySelector(sel); if(el){ el.focus(); if(select && el.select) el.select(); el.scrollIntoView({block:"center"}) } }
function armConfirm(id){ confirmDel = id; render(); clearTimeout(confirmT); confirmT = setTimeout(() => { confirmDel = null; if(view !== "today") render() }, 3000) }
function go(v, anchor){ flush(); sheet = null; view = v; render(); if(anchor){ const el = document.getElementById(anchor); if(el) el.scrollIntoView() } else window.scrollTo(0,0) }
function goBack(){
  if(sheet){ sheet = null; render(); return true }
  if(ob && ob.mode === "rebuild"){ if(ob.step){ ob.step--; render() } else { ob = null; render() } return true }
  if(ob && ob.step){ ob.step--; render(); return true }
  if(view !== "today"){ go("today"); return true }
  return false;
}
function copyText(s, msg){
  if(A){ A.copy(s); toast(msg || "اتنسخ"); return }
  if(navigator.clipboard) navigator.clipboard.writeText(s).then(() => toast(msg || "اتنسخ"), () => toast("مقدرتش أنسخ"));
}

function doImport(){
  const box = $("#importbox"); let o = null;
  try{ o = JSON.parse(box.value.trim()) }catch(e){}
  if(!o || typeof o !== "object"){ toast("النص ده مش نسخة احتياطية صحيحة"); return }
  let nd = 0, nt = 0;
  for(const [k,v] of Object.entries(o.days || {})){
    if(!/^\d{4}-\d{2}-\d{2}$/.test(k)) continue;
    const d = S.days[k] || (S.days[k] = {date:k, checks:{}}); d.checks = d.checks || {};
    for(const [id,val] of Object.entries((v && v.checks) || {})){ if(val === true && !d.checks[id]){ d.checks[id] = true; nd++ } }
  }
  for(const [id,t] of Object.entries(o.tasks || {})){
    if(S.tasks[id] || !t || typeof t.text !== "string") continue;
    S.tasks[id] = {text:t.text, done:!!t.done, createdAt:t.createdAt || Date.now(), doneAt:t.doneAt || null, due:t.due || null, dateOnly:!!t.dateOnly, ring:!!t.ring, nag:t.nag !== false}; nt++;
  }
  let extra = "";
  if(Array.isArray(o.groups) && o.settings){
    const code = S.settings.alarm.code;
    const n = normalize({v:o.v, groups:o.groups, settings:o.settings});
    S.groups = n.groups; S.settings = n.settings; S.settings.alarm.code = code;
    ptCache = {}; extra = " والبنود والإعدادات";
  } else if(!S.groups.length && nd){
    S.groups = normalize({v:2, groups:clone(LEGACY)}).groups; extra = " والبنود";
  }
  S.onboarded = true; ob = null;
  save(true); box.value = ""; applyTheme(); render(); toast("اتنقل "+ar(nd)+" علامة و"+ar(nt)+" تاسك"+extra);
}

function checkUpdate(manual){
  if(!A) return;
  let last = 0;
  try{ last = +localStorage.getItem("updChecked") || 0; upd = JSON.parse(localStorage.getItem("upd") || "null") }catch(e){}
  if(!manual && Date.now() - last < 6*3600e3) return;
  // version.json is served by GitHub Pages (a CDN, no rate limit); the GitHub API allows only
  // 60 calls an hour per IP, which many phones behind one mobile-carrier IP would exhaust.
  const viaPages = () => fetch(SITE+"version.json", {cache:"no-store"}).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(j => +j.versionCode || Promise.reject("bad"));
  const viaApi = () => fetch("https://api.github.com/repos/mahran20/yawmi/releases/latest", {cache:"no-store"}).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(j => parseInt(String(j.tag_name || "").replace(/\D/g, ""), 10) || 0);
  viaPages().catch(viaApi)
    .then(v => {
      upd = v > (status.versionCode || 0) ? {v} : null;
      try{ localStorage.setItem("updChecked", String(Date.now())); localStorage.setItem("upd", JSON.stringify(upd)) }catch(e){}
      if(manual) toast(upd ? "فيه نسخة جديدة" : "عندك آخر نسخة");
      render();
    })
    .catch(() => { if(manual) toast("مفيش نت دلوقتي") });
}

function sheetTarget(){ if(!sheet || sheet.type === "task") return null; const g = findG(sheet.g); if(!g) return null; return sheet.i ? g.items.find(x => x.id === sheet.i) : g }

  switch(act){

      else { gs.forEach(g => { if(g.kind === "prayers" && hasPrayers()) return; if(findG(g.id)) g.id = uid("g"); S.groups.push(g) }) }
      const first = !S.onboarded;

      if(first){ ping("/start/"+(gs.length ? "smart" : "empty")); ping("/fajr/"+fl); gs.forEach(g => ping("/group/"+(g.pack || g.icon || "custom"))) }

    }

        if(n) d.counts[id] = n; else delete d.counts[id];
        if(n === it.target) toast("خلصت هدف «"+it.label+"»");
      } else { if(d.checks[id]) delete d.checks[id]; else d.checks[id] = true }
      save(true); render(); break;
    }
    case "fajr-open": flush(); sheet = {type:"fajr", k:b.dataset.k}; render(); break;
    case "fajr-set": case "fajr-clear": {
      const k = sheet.k; const d = S.days[k] || (S.days[k] = {date:k, checks:{}}); d.checks = d.checks || {};
      if(act === "fajr-set"){ d.checks.fajr = true; d.fajr = Object.assign(d.fajr || {}, {s:v}) }
      else { delete d.checks.fajr; if(d.fajr) delete d.fajr.s }
      sheet = null; save(true); render();
      if(act === "fajr-set"){ const n = fajrStreak(); toast(n >= 2 ? ar(n)+" أيام فجر ورا بعض 🌅" : "تقبّل الله 🌅") }

    }

    case "chal-start": S.settings.fajr.challenge = {start:keyOf(today)}; save(true); render(); toast("بدأ تحدّي ٤٠ يوم فجر. ربنا يعينك 🌅"); ping("/challenge/start"); break;
    case "chal-stop": if(confirmDel !== "__chal"){ armConfirm("__chal"); break } confirmDel = null; S.settings.fajr.challenge = null; save(true); render(); break;
    case "sleep-step": S.settings.fajr.sleepHours = Math.max(5, Math.min(9, S.settings.fajr.sleepHours + (+v))); save(true); render(); break;
    case "bedtime": S.settings.fajr.bedtime = !S.settings.fajr.bedtime; save(true); render(); break;
    case "hist": flush(); sheet = {type:"hist", g:b.dataset.g, i:b.dataset.i}; render(); break;
    case "target-type": { const t = sheetTarget(); if(!t) break; if(v === "count"){ t.target = t.target > 1 ? t.target : 8; t.unit = t.unit || "" } else { delete t.target; delete t.unit } save(true); render(); break }
    case "target-step": { const t = sheetTarget(); if(!t || !(t.target > 1)) break; t.target = Math.max(2, Math.min(99, t.target + (+v))); save(true); render(); break }
    case "share-backup": { flush(); const bk = Object.assign({}, S); delete bk.meta; if(A && A.share) A.share(JSON.stringify(bk)); else copyText(JSON.stringify(bk), "اتنسخت"); break }
    case "prev": sel.setDate(sel.getDate()-1); render(); break;
    case "next": if(keyOf(sel) !== keyOf(today)){ sel.setDate(sel.getDate()+1); render() } break;
    case "settings": go("settings"); break;
    case "edit": go("edit"); break;
    case "reports": go("reports"); break;
    case "back": goBack(); break;
    case "task-check": { const t = S.tasks[id]; if(!t) break; t.done = !t.done; t.doneAt = t.done ? Date.now() : null; save(true); render(); break }

    }
    case "task-clear-due": { const t = S.tasks[sheet.id]; if(!t) break; t.due = null; t.dateOnly = false; t.ring = false; sheet = null; save(true); render(); toast("اتشال المعاد"); break }
    case "toggle-due": showDue = !showDue; render(); if(showDue) focusSel("#new-date"); break;
    case "fix": { const al = S.settings.alarm; go("settings", status.notifications && al.enabled && !al.code ? "sec-alarm" : "sec-perms"); break }

    case "install": if(installEvt){ installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render() }) } break;
    /* edit */
    case "grp-add": { const g = mkGroup({title:"قسم جديد", color:COLORS[S.groups.length % COLORS.length]}); S.groups.push(g); save(true); render(); focusSel(`[data-input="grp-title"][data-g="${g.id}"]`, true); break }
    case "add-pack": {
      const k = b.dataset.k; if(!PACKS[k]) break;
      const g = groupFromPack(k); if(findG(g.id)) g.id = uid("g");
      S.groups.push(g); ptCache = {}; save(true); render(); toast("اتضاف قسم "+PACKS[k].title); break;
    }
    case "grp-del": { const g = b.dataset.g; if(confirmDel !== g){ armConfirm(g); break } S.groups = S.groups.filter(x => x.id !== g); confirmDel = null; save(true); render(); toast("القسم اتمسح"); break }
    case "item-add": { const g = findG(b.dataset.g); if(!g) break; const it = mkItem({label:"بند جديد"}); g.items.push(it); save(true); render(); focusSel(`[data-input="item-label"][data-i="${it.id}"]`, true); break }
    case "item-del": {
      const g = findG(b.dataset.g), i = b.dataset.i; if(!g) break;
      if(confirmDel !== i){ armConfirm(i); break }
      g.items = g.items.filter(x => x.id !== i); confirmDel = null; save(true); render(); toast("البند اتمسح"); break;
    }
    case "sheet-group": flush(); sheet = {g:b.dataset.g}; render(); break;
    case "sheet-item": flush(); sheet = {g:b.dataset.g, i:b.dataset.i}; render(); break;
    case "sheet-close": sheet = null; render(); break;
    case "pick-icon": case "pick-color": {
      const target = sheetTarget(); if(!target) break;
      const val = v || null;
      if(act === "pick-icon") target.icon = val; else target.color = val || (sheet.i ? null : "green");
      save(true); render(); break;
    }
    case "sched-type": {
      const target = sheetTarget(); if(!target) break;

      save(true); render(); break;
    }
    case "sched-day": {

    case "perm-notif": if(A) A.requestNotifications(); break;

    case "restore": {
      const sel2 = document.getElementById("snap"); const k = sel2 && sel2.value; if(!k) break;

      confirmDel = null; flush();

      break;

      S = defaults(); S.settings.theme = theme; S.meta = meta; S.settings.analytics = an; ob = null;

}

  else if(k === "grp-title"){ const g = findG(el.dataset.g); if(g){ g.title = el.value; save() } }
  else if(k === "item-label"){ const it = findI(el.dataset.g, el.dataset.i); if(it){ it.label = el.value; save() } }
  else if(k === "item-unit"){ const it = findI(el.dataset.g, el.dataset.i); if(it){ it.unit = el.value.slice(0,12); save() } }
}
app.addEventListener("input", onInput);

app.addEventListener("change", e => {
  const el = e.target, k = el.dataset.input; if(!k) return;
  if(k === "item-time"){
    const it = findI(el.dataset.g, el.dataset.i); if(!it) return;
    it.time = el.value || null; save(true);
    if(A) toast(el.value ? "هفكّرك بـ«"+(it.label || "البند")+"» الساعة "+fmt12(el.value) : "اتشال التذكير");
  } else if(k === "alarm-offset"){ S.settings.alarm.offset = +el.value; save(true); render() }
  else if(k === "nightly-time"){ if(el.value){ S.settings.nightly.time = el.value; save(true); toast("هفكّرك الساعة "+fmt12(el.value)) } }
  else if(k === "rp-from" || k === "rp-to"){ rp.from = ($("#rp-from") || {}).value || ""; rp.to = ($("#rp-to") || {}).value || ""; render() }
});

app.addEventListener("submit", e => {
  if(e.target.id !== "addform") return;
  e.preventDefault();
  const inp = $("#newtask"); const text = inp.value.trim(); if(!text) return;
  const r = showDue ? readDue("new") : {due:null, dateOnly:false, ring:false, nag:true};
  S.tasks[uid("t")] = Object.assign({text, done:false, createdAt:Date.now(), doneAt:null}, r);
  inp.value = ""; ["new-date","new-time"].forEach(i => { const x = document.getElementById(i); if(x) x.value = "" }); showDue = false;
  save(true); render(); focusSel("#newtask");
  if(r.due) toast(A ? "هفكّرك "+fmtDue(Object.assign({}, r)) : "المعاد اتسجل");
});

document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden") flush() });
// Escape closes a sheet on laptops, like the back button on phones
document.addEventListener("keydown", e => { if(e.key === "Escape" && sheet){ sheet = null; render() } });

/* ---------- native hooks ---------- */
window.onNativeBack = goBack;
window.onNativeStatus = () => render();
window.onNativeResume = () => {
  flush(); load(); ptCache = {}; applyTheme();
  const t = logicalToday();
  if(keyOf(t) !== keyOf(today)){ if(keyOf(sel) === keyOf(today)) sel = new Date(t); today = t }
  render(); checkUpdate(false); track();
};
/* Changes made outside the page (widget, notification buttons, alarm) are already on disk;
   apply them here too so the next save doesn't overwrite them. Each one only adds, so applying twice is harmless. */
window.onNativeChange = ev => {
  if(!ev || !S) return;
  const day = k => S.days[k] || (S.days[k] = {date:k, checks:{}});
  if(ev.kind === "check"){ const d = day(ev.date); (d.checks = d.checks || {})[ev.item] = true }
  else if(ev.kind === "count"){ const d = day(ev.date); d.counts = d.counts || {}; d.counts[ev.item] = Math.max(d.counts[ev.item] || 0, ev.n); if(ev.done) (d.checks = d.checks || {})[ev.item] = true }
  else if(ev.kind === "wake"){ const d = day(ev.date); d.fajr = Object.assign(d.fajr || {}, {wake:ev.hm}) }
  else if(ev.kind === "task"){ const t = S.tasks[ev.id]; if(t && !t.done){ t.done = true; t.doneAt = ev.at } }
  else return;
  if(!ob && !sheet) render();
};
window.onNativeScan = code => {
  if(!code){ toast("ماتسجلش كود"); return }
  S.settings.alarm.code = code; save(true); render();
  toast("الكود اتسجل. المنبه مش هيسكت غير بيه");
};
window.onNativeLocation = loc => {
  if(!loc){ toast("مقدرتش أجيب موقعك. شغّل الـ Location وجرب تاني"); return }
  S.settings.loc = {name:"موقعي", lat:+(+loc.lat).toFixed(4), lng:+(+loc.lng).toFixed(4)};
  ptCache = {}; save(true); render(); toast("المواقيت اتظبطت على موقعك");
};

setInterval(() => {
  if(view !== "today" || sheet || ob) return;
  const a = document.activeElement;
  if(a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA")) return;
  const t = logicalToday();
  if(keyOf(t) !== keyOf(today)){ if(keyOf(sel) === keyOf(today)) sel = new Date(t); today = t }
  render();
}, 30000);

window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if(view === "today" && !ob) render() });
if(!A && "serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
load(); applyTheme(); render(); checkUpdate(false); track(); reportCrash();
if(recovered) toast("رجّعت بياناتك من نسخة "+fmtSnap(recovered));
window.__yawmi = {calcTimes, normalize, defaults, computeReport, get S(){ return S }};
})();
</script>
